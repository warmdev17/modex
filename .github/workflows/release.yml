name: Prepare release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: modex-release
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
      - run: |
          go test -race ./...
          go vet ./...
          go build -o /tmp/modex-host ./cmd/modex-host
          MODEX_HOST_BINARY=/tmp/modex-host python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.8.2
          args: release --clean
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: python3 scripts/verify_native_packages.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    # Owner configures this protected environment; never grant signing secrets to PR jobs.
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon
        working-directory: android
      - name: Build and verify signed APK
        env:
          MODEX_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MODEX_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MODEX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MODEX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MODEX_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -eu
          umask 077
          : "${MODEX_KEYSTORE_B64:?Missing release keystore}"
          : "${MODEX_CERT_SHA256:?Missing pinned signing certificate}"
          export MODEX_KEYSTORE="$RUNNER_TEMP/modex-release.jks"
          trap 'rm -f "$MODEX_KEYSTORE"' EXIT
          printf '%s' "$MODEX_KEYSTORE_B64" | base64 --decode > "$MODEX_KEYSTORE"
          export MODEX_RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          export MODEX_VERSION_CODE="$((GITHUB_RUN_NUMBER + 1000))"
          ./android/gradlew -p android :app:assembleRelease --no-daemon
          python3 scripts/verify_release_apk.py android/app/build/outputs/apk/release/app-release.apk --version "$MODEX_RELEASE_VERSION" --code "$MODEX_VERSION_CODE" --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk "release-apk/modex-${MODEX_RELEASE_VERSION}.apk"
          printf '%s\n' "$MODEX_VERSION_CODE" > release-apk/android-version-code.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-apk/*
          if-no-files-found: error
  draft:
    needs: [native, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: release-assets
      - name: Assemble checksums and prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cp scripts/install.sh release-assets/install.sh
          cp docs/install.md release-assets/INSTALL.md
          python3 scripts/check_release_code.py --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --code "$(cat release-assets/android-version-code.txt)"
          cd release-assets
          sha256sum ./*.apk ./*.tar.gz ./*.zip ./*.deb ./*.rpm install.sh INSTALL.md android-version-code.txt | sed 's|  ./|  |' > checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --title "Modex $GITHUB_REF_NAME" --notes-file INSTALL.md ./*
