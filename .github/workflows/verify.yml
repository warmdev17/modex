name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: |
          go build -o /tmp/modex-host ./cmd/modex-host
          MODEX_HOST_BINARY=/tmp/modex-host python3 -m unittest discover -s scripts -p 'test_*.py'
      - if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
        working-directory: android
      - name: Unsigned release must fail
        run: |
          if ./android/gradlew -p android :app:assembleRelease --no-daemon > /tmp/unsigned.log 2>&1; then
            echo 'Release unexpectedly built without signing inputs'; exit 1
          fi
          grep -q 'Release signing requires' /tmp/unsigned.log
  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.8.2
          args: release --snapshot --clean
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: python3 scripts/verify_native_packages.py dist
